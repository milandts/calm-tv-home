name: Checks

# Runs everything that needs no device: compile both apps with javac and d8, layout rules, logic tests, doc references.
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        with:
          distribution: temurin
          java-version: '17'
      - name: Install the SDK parts the build needs
        run: |
          export ANDROID_SDK="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          yes | "$ANDROID_SDK/cmdline-tools/latest/bin/sdkmanager" --sdk_root="$ANDROID_SDK" "platforms;android-33" "build-tools;33.0.0" >/dev/null
          echo "ANDROID_SDK=$ANDROID_SDK" >> "$GITHUB_ENV"
      - name: Run all checks
        run: scripts/check-all.sh
